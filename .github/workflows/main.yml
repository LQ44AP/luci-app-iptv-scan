name: Build IPTV Scan Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '23.05.6'
            format: 'ipk'
            sdk_url: 'https://downloads.openwrt.org/releases/23.05.6/targets/x86/64/openwrt-sdk-23.05.6-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz'
            sdk_ext: 'xz'
          - version: '25.12.5'
            format: 'apk'
            sdk_url: 'https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
            sdk_ext: 'zst'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Download OpenWrt SDK
        run: |
          wget -q -O sdk.tar.${{ matrix.sdk_ext }} "${{ matrix.sdk_url }}"
          mkdir -p sdk
          if [ "${{ matrix.sdk_ext }}" = "zst" ]; then
            tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          else
            tar -xJf sdk.tar.xz -C sdk --strip-components=1
          fi

      - name: Copy source into SDK package dir
        run: |
          mkdir -p sdk/package/luci-app-iptv-scan
          cp -r ./Makefile ./root ./htdocs sdk/package/luci-app-iptv-scan/

      - name: Update and install feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base
          ./scripts/feeds install rpcd-mod-ucode
          ./scripts/feeds install ucode
          ./scripts/feeds install luasocket

      - name: Build package
        working-directory: sdk
        run: |
          make defconfig
          make package/luci-app-iptv-scan/compile

      - name: Collect packages
        run: |
          mkdir -p dist
          find sdk/bin/packages -type f \
            \( -name 'luci-app-iptv-scan*.ipk' -o -name 'luci-app-iptv-scan*.apk' \) \
            -exec cp {} dist/ \;
          echo "=== collected ==="
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv-scan-${{ matrix.format }}
          path: dist/*.*pk
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.*pk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
