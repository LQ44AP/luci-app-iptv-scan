name: Build IPTV Scan Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '23.05.6'
            format: 'ipk'
          - version: '25.12.5'
            format: 'apk'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 显式把当前仓库注册为自定义 feed。
      # 如果你的包位于仓库根目录，SOURCE 就是 .
      # 如果包位于 luci-app-iptv-scan/ 子目录，SOURCE 就是 ./luci-app-iptv-scan
      - name: Setup custom feed
        run: |
          mkdir -p /tmp/feed-src
          # 根据你的仓库结构调整：包在根目录用 `.`，在子目录用 `./luci-app-iptv-scan`
          cp -r ./* /tmp/feed-src/ 2>/dev/null || true
          ls -la /tmp/feed-src

      - name: Build with SDK
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: x86_64-${{ matrix.version }}
          FEEDNAME: iptvscan_ci
          PACKAGES: luci-app-iptv-scan
          # 关键：告诉 action 我们已经在自定义 feed 里
          NO_REFRESH_CHECK: 1

      - name: Collect packages
        run: |
          mkdir -p dist
          find bin/packages -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv-scan-${{ matrix.format }}
          path: dist/*.*pk
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.*pk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
